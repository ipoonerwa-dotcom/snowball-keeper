name: snowball-rank

# 定期重算团队 U 业绩 + 等级并推上链(前端的"团队业绩/等级"读的就是这份链上数据)。
# 调用只推 rank/teamUsd,热钱包(rankUpdater)无资金权限。
#
# ★ 纯链上读,不需要 Alchemy/getLogs ★
# 一次性设置(与 poke keeper 同一仓库即可):
#   Secrets:  KEEPER_PK      = rankUpdater 热钱包私钥(owner 部署时已 setRankUpdater 授权)
#   Variables:SNOWBALL_BUY_ROUTER = buy-router 地址
#             可选:TIER_THRESHOLDS / PUSH_BATCH / READ_CHUNK / RPC_URL(普通公共节点即可)

on:
  schedule:
    - cron: "*/15 * * * *"   # 每 ~15 分钟重算一次(GitHub 定时尽力而为;主触发建议用 cron-job.org 打 workflow_dispatch)
  workflow_dispatch: {}

concurrency:
  group: snowball-rank
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Recompute ranks + push on-chain
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          SNOWBALL_BUY_ROUTER: ${{ vars.SNOWBALL_BUY_ROUTER || secrets.SNOWBALL_BUY_ROUTER }}
          RPC_URL: ${{ vars.RPC_URL || 'https://bsc-rpc.publicnode.com' }}
          TIER_THRESHOLDS: ${{ vars.TIER_THRESHOLDS || '' }}
          PUSH_BATCH: ${{ vars.PUSH_BATCH || '' }}
          READ_CHUNK: ${{ vars.READ_CHUNK || '' }}
        run: |
          if [ -z "$KEEPER_PK" ]; then
            echo "::warning::KEEPER_PK 未设 —— 跳过。"
            exit 0
          fi
          node snowball-rank.mjs
