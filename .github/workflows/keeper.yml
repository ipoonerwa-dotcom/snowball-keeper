name: snowball-poke

# 每天把 Snowball 签约的当日奖励按 5 分钟 TWAP 结算入账(refreshBaseline → 等 ~6min → poke)。
# 调用全部 permissionless,热钱包只付 gas、无任何角色。
#
# 一次性设置:
#   1) 生成一个全新钱包(不要用 owner/部署/guardian 私钥),充一点点 BNB 付 gas。
#   2) 仓库 Settings → Secrets and variables → Actions → New repository secret:
#        KEEPER_PK        = 该新钱包私钥(0x…)
#   3) 同页 Variables(或 Secrets)加:
#        SNOWBALL_STAKING = 签约合约地址(合约部署后填;预言机地址脚本会自动读)
#      可选 Variables:RPC_URL、WINDOW_WAIT_MS
#   4) 推这个仓库。之后按下面的时间自动跑;也可在 Actions 页手动 Run workflow。
#
# 提示:用「公开仓库」→ GitHub Actions 分钟数免费/不限量(私有仓库每月上限 2000 分钟)。

on:
  schedule:
    # 【为什么要全天候排点,而不是只在凌晨排三次】
    # 合约的 pokeInterval 是 20 小时冷却,而原来只在北京 00:00 / 00:20 / 01:00 排三次。
    # 一旦某天的结算被迫延后(2026-07-29 就出过:RPC 封写导致凌晨全挂,14:27 才补跑),
    # 冷却就顺延到次日 10:27 —— 而次日那三次全在 00:00~01:00,【全部撞在冷却里被跳过】,
    # 于是次日一整天没有结算,社区第二天就来问"今天怎么没收益"。一次延后会连累后面每一天。
    #
    # 改成每 3 小时一次:任何时刻冷却一解除,最多 3 小时内就会有一次成功结算,自动回到正轨。
    # 代价几乎为零 —— 脚本【第一件事就是查冷却】,没到就 2 秒内早退(见 snowball-poke.mjs),
    # 只有真正该结算的那一次才会走完 6 分钟的 TWAP 窗口。
    #
    # 仍然保留凌晨那两个点:正常情况下每天的结算依旧发生在 0 点后不久,口径对社区不变。
    - cron: "0 16 * * *"    # 16:00 UTC = 次日 00:00 北京(正常情况下当天的结算就在这里发生)
    - cron: "20 16 * * *"   # 00:20 北京(紧邻备份,防 GitHub 调度抖动)
    - cron: "0 19,22,1,4,7,10,13 * * *"  # 北京 03/06/09/12/15/18/21 点:冷却延后时的追赶点
  workflow_dispatch: {}

concurrency:
  group: snowball-poke
  cancel-in-progress: false   # 绝不并发两轮(避免 nonce 冲突)

jobs:
  poke:
    runs-on: ubuntu-latest
    # 脚本里要 sleep ~6 分钟等 TWAP 窗口;15 分钟硬上限只做余量(含 npm install)。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Daily double-poke
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          SNOWBALL_STAKING: ${{ vars.SNOWBALL_STAKING || secrets.SNOWBALL_STAKING }}
          # 不给默认值:留空时脚本用自带的候选列表逐个试(见 snowball-poke.mjs)。
          # 以前这里硬塞 publicnode,等于把候选列表压成单个节点 —— 它一被封就全盘挂掉。
          RPC_URL: ${{ vars.RPC_URL }}
          WINDOW_WAIT_MS: ${{ vars.WINDOW_WAIT_MS || '' }}
          # 奖励池低于此值(整枚 SNOWBALL)且已有签约本金 → Actions 里报 warning,提醒社区补币。默认 4000。
          LOW_RESERVE_ALERT: ${{ vars.LOW_RESERVE_ALERT || '' }}
        run: |
          if [ -z "$KEEPER_PK" ]; then
            echo "::warning::KEEPER_PK 未设 —— 跳过。到仓库 Settings → Secrets 添加后启用。"
            exit 0
          fi
          node snowball-poke.mjs
